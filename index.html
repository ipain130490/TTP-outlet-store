<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log in or Sign up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="logo">
                <h1>facebook</h1>
            </div>
            <div class="tagline">
                <p>Facebook helps you connect and share with the people in your life.</p>
            </div>
        </div>
        
        <div class="right-section">
            <div class="login-box">
                <form id="loginForm">
                    <input type="text" id="username" placeholder="Email address or phone number" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" class="login-btn">Log in</button>
                    <div class="forgot-password">
                        <a href="#">Forgotten password?</a>
                    </div>
                    <div class="divider"></div>
                    <button type="button" class="create-account-btn">Create new account</button>
                </form>
            </div>
            <div class="create-page">
                <p><a href="#">Create a Page</a> for a celebrity, brand or business.</p>
            </div>
        </div>
    </div>
    
    <div id="output" class="output"></div>
    
    <script src="script.js"></script>
</body>
</html>
